<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Metaskills</title>
    <style>
      @font-face {
        font-family: "quicksand";
        src: url("/fonts/quicksand.woff2") format("woff2");
        font-style: normal;
        font-display: swap;
      }
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fff5f2 0%, #fff 100%);
        font-family: "quicksand", sans-serif;
        text-align: center;
        color: #333;
      }
      .container {
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .icon {
        font-size: 80px;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
      }
      h1 {
        font-size: 2.5rem;
        margin: 0 0 15px;
        font-weight: 800;
        color: #333;
      }
      p {
        font-size: 1.1rem;
        color: #666;
        max-width: 600px;
        margin-bottom: 30px;
        line-height: 1.6;
      }
      .spinner {
        border: 3px solid rgba(255, 87, 34, 0.1);
        border-radius: 50%;
        border-top: 3px solid #ff5722;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      .status-text {
        font-size: 0.9rem;
        color: #ff5722;
        font-weight: 600;
        margin-bottom: 20px;
      }
      button {
        padding: 12px 30px;
        font-family: "quicksand", sans-serif;
        font-weight: 700;
        font-size: 1rem;
        color: white;
        background: linear-gradient(90deg, #ff5722, #f4511e);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 87, 34, 0.4);
      }
      button:active {
        transform: translateY(0);
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.8;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>No Internet Connection</h1>
      <p>
        It seems you are offline. Please check your internet connection. We are
        trying to reconnect...
      </p>
      <div class="spinner"></div>
      <div class="status-text">Checking connection...</div>
      <button onclick="window.location.reload()">Try Again Now</button>
    </div>

    <script>
      function checkConnection() {
        if (navigator.onLine) {
          fetch("/favicon.ico", { method: "HEAD", cache: "no-store" })
            .then(() => {
              window.location.reload();
            })
            .catch(() => {
              // Still offline
            });
        }
      }

      setInterval(checkConnection, 3000);
      window.addEventListener("online", checkConnection);
    </script>
  </body>
</html>
