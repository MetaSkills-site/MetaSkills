# CodeQL Advanced was retired in favor of GitHub's default CodeQL setup.
# Keep this workflow manual-only to avoid duplicate SARIF uploads while
# preserving a clear explanation if someone tries to run the old workflow.
name: "CodeQL Advanced (retired)"

on:
  workflow_dispatch:

jobs:
  retired:
    name: Retired
    runs-on: ubuntu-latest
    steps:
      - name: Explain that default setup is active
        run: echo "This advanced CodeQL workflow is retired. Use GitHub's default CodeQL setup instead."
